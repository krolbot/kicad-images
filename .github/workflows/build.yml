name: KiCad toolkit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest -v test_pcm.py
      - run: python -m compileall -q pcm.py mcp_smoke.py
      - run: |
          sh -n root/usr/local/bin/kicad-mcp root/usr/local/bin/freerouting root/usr/local/bin/ibom root/defaults/autostart root/defaults/autostart_wayland
          bash -n root/custom-cont-init.d/50-kicad-toolkit.sh

  build:
    # Source changes are checked without starting/building a CAD image.
    # Publish the monolithic image only through an explicit manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    needs: source-checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          # Reuse the existing public package; no new private GHCR package.
          tags: |
            ghcr.io/krolbot/kicad-gui:10.0.7-0.21.1-fr2.1.0-tools5
            ghcr.io/krolbot/kicad-gui:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/krolbot/kicad-images
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=kicad-unified
          cache-to: type=gha,mode=max,scope=kicad-unified
          provenance: true
