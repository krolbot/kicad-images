name: Build KiCad images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.gui
      - mcp_smoke.py
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

jobs:
  build-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/krolbot/kicad-mcp:10.0.6-0.21.1-fr2.1.0-tools1
            ghcr.io/krolbot/kicad-mcp:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/krolbot/kicad-images
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=kicad-mcp
          cache-to: type=gha,mode=max,scope=kicad-mcp
          provenance: true

  build-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gui
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/krolbot/kicad-gui:10.0.3-tools3
            ghcr.io/krolbot/kicad-gui:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/krolbot/kicad-images
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=kicad-gui
          cache-to: type=gha,mode=max,scope=kicad-gui
          provenance: true
