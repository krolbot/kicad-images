name: KiCad toolkit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --no-compile -r requirements-mcp.txt
      - run: python -m unittest -v
      - run: python -m compileall -q pcm.py mcp_http.py mcp_smoke.py mcp_http_smoke.py mcp_autoroute_smoke.py mcp_board_batch.py mcp_board_batch_fixture.py mcp_board_batch_smoke.py mcp_board_batch_worker.py toolkit_mcp.py toolkit_native.py toolkit_ipc.py mcp_toolkit_smoke.py addon_operations_smoke.py native_ipc_smoke.py
      - run: |
          sh -n root/usr/local/bin/kicad-mcp root/usr/local/bin/kicad-mcp-http root/usr/local/bin/freerouting root/usr/local/bin/ibom root/defaults/autostart root/defaults/autostart_wayland
          bash -n root/custom-cont-init.d/50-kicad-toolkit.sh

  build:
    # Source changes are checked without starting/building a CAD image.
    # Publish the monolithic image only through an explicit manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    needs: source-checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          # Reuse the existing public package; no new private GHCR package.
          tags: |
            ghcr.io/krolbot/kicad-gui:10.0.8-0.21.1-fr2.5.0-tools11
            ghcr.io/krolbot/kicad-gui:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/krolbot/kicad-images
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=kicad-unified
          cache-to: type=gha,mode=max,scope=kicad-unified
          provenance: false
      - name: Run HTTP MCP as PID 1 and fill a real zone
        env:
          IMAGE: ghcr.io/krolbot/kicad-gui:10.0.8-0.21.1-fr2.5.0-tools11
        run: |
          set -euo pipefail
          name=kicad-http-pid1-smoke
          projects="$RUNNER_TEMP/kicad-http-pid1-smoke"
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker run --rm --network none --user 1000:1000 --read-only \
              --cap-drop ALL --security-opt no-new-privileges:true \
              -v "$projects:/projects" --entrypoint /bin/rm "$IMAGE" \
              -rf /projects/http-mcp-smoke >/dev/null 2>&1 || true
            rm -rf "$projects"
          }
          trap cleanup EXIT
          mkdir -p "$projects/http-mcp-smoke"
          chmod 0777 "$projects" "$projects/http-mcp-smoke"
          docker run --rm --network none --user 1000:1000 --read-only \
            --tmpfs /tmp:rw,nosuid,size=512m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e HOME=/tmp/kicad-home \
            -e XDG_CONFIG_HOME=/tmp/kicad-home/.config \
            -e XDG_CACHE_HOME=/tmp/kicad-home/.cache \
            -e KICAD_CONFIG_HOME=/tmp/kicad-home/.config/kicad \
            -v "$projects:/projects" --entrypoint /opt/kicad-mcp/bin/python "$IMAGE" \
            /usr/local/share/kicad/mcp_http_smoke.py prepare
          docker run -d --name "$name" --network none --user 1000:1000 --read-only \
            --tmpfs /tmp:rw,nosuid,size=512m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e HOME=/tmp/kicad-home \
            -e XDG_CONFIG_HOME=/tmp/kicad-home/.config \
            -e XDG_CACHE_HOME=/tmp/kicad-home/.cache \
            -e KICAD_CONFIG_HOME=/tmp/kicad-home/.config/kicad \
            -e KICAD_MCP_BEARER_TOKEN=build-only-mcp-token \
            -e KICAD_MCP_ALLOWED_HOSTS=127.0.0.1:18080 \
            -v "$projects:/projects" \
            --entrypoint /usr/local/bin/kicad-mcp-http "$IMAGE" \
            --host 127.0.0.1 --port 18080
          for _ in $(seq 1 30); do
            if docker exec "$name" python3 -c 'import socket; socket.create_connection(("127.0.0.1", 18080), 1).close()'; then
              break
            fi
            sleep 1
          done
          docker exec "$name" python3 -c 'import socket; socket.create_connection(("127.0.0.1", 18080), 1).close()'
          docker exec "$name" /opt/kicad-mcp/bin/python \
            /usr/local/share/kicad/mcp_http_smoke.py client
      - name: Publish validated image
        run: |
          set -euo pipefail
          docker push "ghcr.io/krolbot/kicad-gui:sha-${GITHUB_SHA}"
          docker push ghcr.io/krolbot/kicad-gui:10.0.8-0.21.1-fr2.5.0-tools11
